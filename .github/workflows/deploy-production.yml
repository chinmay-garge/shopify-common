name: Deploy - Production

# CODE lane, production. Two differences from staging that matter:
#
#   1. An `approve` job gated on the `production-approval` environment runs
#      BEFORE anything is pushed. One approval unblocks every site in the
#      matrix. A job can only declare ONE environment, and the deploy job must
#      declare the per-site environment to read that site's STORE/THEME_ID/
#      token — hence approval is a separate upstream job rather than an
#      `environment:` on the deploy job itself.
#
#   2. Every site's current live theme is downloaded and uploaded as an
#      artefact before being overwritten, so there is always a rollback point.

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      site:
        description: 'Site to deploy (default: all)'
        type: choice
        default: All
        options: [All, SITE-A, SITE-B, SITE-C]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          SITES: ${{ vars.PRODUCTION_SITES }}
          PICKED: ${{ github.event.inputs.site }}
        run: |
          if [ -n "$PICKED" ] && [ "$PICKED" != "All" ]; then
            printf 'matrix=["%s"]\n' "$PICKED" >> "$GITHUB_OUTPUT"
          else
            json=$(echo "$SITES" | tr ',' '\n' | sed '/^$/d' | jq -R . | jq -sc .)
            echo "matrix=$json" >> "$GITHUB_OUTPUT"
          fi

  approve:
    needs: setup
    if: ${{ needs.setup.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    environment: production-approval
    steps:
      - run: |
          echo "Approved production deploy of ${{ github.ref_name }}"
          echo "Sites: ${{ needs.setup.outputs.matrix }}"

  deploy:
    needs: [setup, approve]
    name: Deploy (${{ matrix.site }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJson(needs.setup.outputs.matrix) }}
    environment: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build theme
        run: npm run build

      - name: Fail fast if build output is missing
        run: |
          for f in theme/assets/global.vbt.css theme/assets/global.vbt.js; do
            if [ ! -s "$f" ]; then
              echo "::error::Expected build artefact $f is missing or empty — refusing to deploy."
              exit 1
            fi
          done

      # One call covers every later step in this job — the action exports
      # SHOPIFY_CLI_THEME_TOKEN via GITHUB_ENV.
      - name: Get Shopify access token
        uses: ./.github/actions/shopify-token
        with:
          store: ${{ vars.STORE }}
          client-id: ${{ secrets.SHOPIFY_CLIENT_ID }}
          client-secret: ${{ secrets.SHOPIFY_CLIENT_SECRET }}

      - name: Back up current live theme
        run: |
          mkdir -p ./backup
          shopify theme pull \
            --path ./backup \
            --theme ${{ vars.THEME_ID }} \
            --store ${{ vars.STORE }}

      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ matrix.site }}-${{ github.run_id }}
          path: ./backup/
          retention-days: 90

      - name: Push theme code to Production
        id: push
        run: |
          set -o pipefail
          shopify theme push -j \
            --allow-live \
            --path theme/ \
            --ignore "src/*" \
            --ignore ".theme-check.yml" \
            --ignore package.json \
            --ignore config/settings_data.json \
            --ignore "locales/*.json" \
            --ignore "sections/*.json" \
            --ignore "templates/*.json" \
            --ignore "templates/customers/*.json" \
            --theme ${{ vars.THEME_ID }} \
            --store ${{ vars.STORE }} > push-result.json
          cat push-result.json

      - name: Write summary
        if: always()
        run: |
          if [ -s push-result.json ]; then
            {
              echo "### ${{ matrix.site }} — production"
              echo "- Theme: $(jq -r '.theme.name' push-result.json) (#$(jq -r '.theme.id' push-result.json))"
              echo "- Backup artefact: \`backup-${{ matrix.site }}-${{ github.run_id }}\` (90 days)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ${{ matrix.site }}: push failed, no output captured" >> "$GITHUB_STEP_SUMMARY"
          fi

  # A failed production deploy is the one thing nobody should have to notice by
  # chance. GitHub emails the actor, but that misses everyone else — so leave a
  # visible artefact in the repo instead.
  notify-failure:
    name: Report failure
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open a failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          gh label create "deploy-failure" --repo "$GITHUB_REPOSITORY" \
            --color b60205 -d "A production deploy failed" 2>/dev/null || true

          {
            echo "A **production** deploy failed. One or more sites may be part-deployed."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Release / ref | \`$REF\` |"
            echo "| Run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo ""
            echo "Sites deploy independently (\`fail-fast: false\`), so check the run to see"
            echo "which succeeded before deciding what to do."
            echo ""
            echo "**To get back to a known-good state**, run the **Rollback - Production**"
            echo "workflow for the affected site(s):"
            echo "- \`redeploy-tag\` with the previous release tag — restores code only"
            echo "- \`restore-backup\` with this run's ID — restores code and content"
            echo ""
            echo "Each site's pre-deploy backup is attached to the failed run as"
            echo "\`backup-<SITE>-${{ github.run_id }}\`, retained for 90 days."
          } > body.md

          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Production deploy failed — $REF" \
            --label "deploy-failure" \
            --body-file body.md
